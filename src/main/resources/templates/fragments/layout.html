<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Show of Hands'">Show of Hands</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/js/api.js}" defer></script>
</head>
<body>
<header th:fragment="nav" class="site-header">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-header__inner">
        <a class="brand" href="/" aria-label="Show of Hands, home">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                <circle cx="16" cy="16" r="14" style="fill:var(--c1)"/>
                <path d="M16 16 L16 2 A14 14 0 0 1 29.3 20.3 Z" style="fill:var(--c2)"/>
                <path d="M16 16 L29.3 20.3 A14 14 0 0 1 9 28.1 Z" style="fill:var(--c3)"/>
            </svg>
            <span class="brand__name">Show of Hands</span>
        </a>
        <nav class="site-nav" aria-label="Account">
            <a href="/" class="site-nav__link" data-testid="nav-my-polls" data-auth="in" hidden>My polls</a>
            <span class="site-nav__user" data-testid="nav-username" data-auth="in" hidden></span>
            <button type="button" class="btn btn--quiet btn--small" data-testid="logout-btn" data-auth="in" hidden>Log out</button>
            <a href="/login" class="btn btn--quiet btn--small" data-testid="nav-login" data-auth="out" hidden>Log in</a>
        </nav>
    </div>
</header>

<div th:fragment="toast" class="toast" data-testid="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
