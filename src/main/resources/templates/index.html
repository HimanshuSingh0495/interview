<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My polls')}"></head>
<body class="page-index">
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="shell">
    <div class="page-head">
        <h1 class="page-head__title">My polls</h1>
        <a href="/polls/new" class="btn btn--primary" data-testid="new-poll-btn">New poll</a>
    </div>

    <p class="loading" id="polls-loading" role="status" aria-live="polite">Loading your polls&hellip;</p>
    <div class="alert alert--error" id="polls-error" role="alert" hidden></div>

    <ul class="poll-list" id="poll-list" aria-label="Polls you created" hidden></ul>

    <section class="empty-state" data-testid="empty-state" hidden aria-labelledby="empty-title">
        <svg class="empty-state__art" viewBox="0 0 120 80" aria-hidden="true" focusable="false">
            <rect x="8" y="44" width="22" height="28" rx="4" style="fill:var(--c1)"/>
            <rect x="38" y="24" width="22" height="48" rx="4" style="fill:var(--c2)"/>
            <rect x="68" y="34" width="22" height="38" rx="4" style="fill:var(--c3)"/>
            <rect x="98" y="54" width="14" height="18" rx="4" style="fill:var(--line-strong)"/>
        </svg>
        <h2 id="empty-title" class="empty-state__title">No polls yet</h2>
        <p class="empty-state__text">Ask a question, add a few answers and send the link to your friends.</p>
        <a href="/polls/new" class="btn btn--primary">Create your first poll</a>
    </section>
</main>
<div th:replace="~{fragments/layout :: toast}"></div>
<script th:src="@{/js/index.js}" defer></script>
</body>
</html>
