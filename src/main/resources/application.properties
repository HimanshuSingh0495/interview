spring.application.name=app

# 8080 is used by another local process on this Mac; override with: PORT=9000 mvn spring-boot:run
server.port=${PORT:8081}

# Local file-backed H2 database -> ./data/appdb.mv.db (relative to where you start the app; git-ignored).
# AUTO_SERVER=TRUE lets a second process (e.g. the H2 shell) open the file while the app is running.
spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Browser DB console at http://localhost:8081/h2-console (local dev only)
spring.h2.console.enabled=true

# Reload template edits without restarting
spring.thymeleaf.cache=false

# Print every SQL statement (INSERT/UPDATE/SELECT) in the app log so DB changes are visible live
logging.level.org.hibernate.SQL=debug

# Bearer tokens (opaque, SHA-256 stored) expire after this long
app.auth.token-ttl=7d
# Users live in our own table; skip Boot's generated in-memory user and its logged password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
